name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m py_compile patch_proton_nm.py tests/test_ci.py
      - name: Run Ruff linter
        run: |
          pip install ruff
          ruff check --ignore F401,E501 patch_proton_nm.py tests/test_ci.py
      - name: Run patch simulation
        run: python tests/test_ci.py

